name: Client tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: client-tests-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build test environment
        run: docker compose build --pull tests
      - name: Run static, unit and contract checks
        env:
          CI: 'true'
        run: |
          TEST_UID=$(id -u) TEST_GID=$(id -g) docker compose run --rm -e CI tests sh -c '
            npm run format:check &&
            npm run lint &&
            node ../scripts/check-release-version.js &&
            npm run test:unit &&
            npm run test:contract
          '
      - name: Run UI tests
        if: github.event_name == 'pull_request'
        env:
          CI: 'true'
        run: TEST_UID=$(id -u) TEST_GID=$(id -g) docker compose run --rm -e CI tests npm run test:ui
      - name: Upload test reports
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: client-test-results
          path: |
            tests/reports/results.json
            tests/reports/junit.xml
            tests/reports/html/
          if-no-files-found: warn
          retention-days: 7
