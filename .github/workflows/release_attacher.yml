name: Release Attacher for client

on:
  release:
    types: [published]

jobs:
  release-archives:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check client version and identity
        run: node scripts/check-release-version.js

      - name: Create archive client
        env:
          ARCHIVE_NAME: client_${{ github.event.release.tag_name }}.zip
        run: |
          zip -q -r -X "$ARCHIVE_NAME" client \
            -x 'client/tests/*' 'client/*.md'
          unzip -tq "$ARCHIVE_NAME"

      - name: Attach archives to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            client_${{ github.event.release.tag_name }}.zip
